name: ICT Bot Engine - 5min Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    name: Run Bot Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Trigger Bot Engine
        env:
          NETLIFY_BOT_URL: ${{ secrets.NETLIFY_BOT_URL }}
          BOT_SECRET_KEY: ${{ secrets.BOT_SECRET_KEY }}
        run: |
          echo "Triggering bot engine"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Bot-Key: ${BOT_SECRET_KEY}" \
            --max-time 55 \
            "${NETLIFY_BOT_URL}")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: ${HTTP_STATUS}"
          echo "Response: ${BODY}"

          if [ "$HTTP_STATUS" != "200" ]; then
            exit 1
          fi
